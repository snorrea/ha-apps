name: Lurker
version: "0.3.5"
slug: lurker
description: Scrape 4chan boards on a schedule and browse sentiment wordclouds in Home Assistant.
url: https://github.com/snorrea/ha-apps/tree/main/lurker
arch:
  - aarch64
  - amd64
image: ghcr.io/snorrea/lurker
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-search
panel_title: Lurker
startup: application
boot: auto
# Needed only for calling opted-in mobile notifications through the Core API proxy.
homeassistant_api: true
# Stop the app while Supervisor copies the history database and its sidecars.
backup: cold
backup_exclude:
  - output/cache/*/catalog.json
  - output/cache/*/[0-9]*.json
  - output/cache/*/.*.json.*.tmp
  - output/cache/nlp-features.sqlite3
  - output/cache/nlp-features.sqlite3-journal
  - output/cache/nlp-features.sqlite3-wal
  - output/cache/nlp-features.sqlite3-shm
  - output/render-cache
options:
  boards:
    - biz - Business & Finance
    - pol - Politically Incorrect
  interval_hours: 6
  retention_days: 30
  history_retention_days: 180
  history_max_topics: 1500
  nlp_cache_max_mib: 128
  max_threads: 200
  request_delay_ms: 1100
  scrape_timeout_seconds: 10800
  run_on_startup: true
  log_level: info
  notification_targets: []
schema:
  boards:
    - "list(3 - 3DCG|\
      a - Anime & Manga|\
      aco - Adult Cartoons|\
      adv - Advice|\
      an - Animals & Nature|\
      b - Random|\
      bant - International/Random|\
      biz - Business & Finance|\
      c - Anime/Cute|\
      cgl - Cosplay & EGL|\
      ck - Food & Cooking|\
      cm - Cute/Male|\
      co - Comics & Cartoons|\
      d - Hentai/Alternative|\
      diy - Do-It-Yourself|\
      e - Ecchi|\
      f - Flash|\
      fa - Fashion|\
      fit - Fitness|\
      g - Technology|\
      gd - Graphic Design|\
      gif - Adult GIF|\
      h - Hentai|\
      hc - Hardcore|\
      his - History & Humanities|\
      hm - Handsome Men|\
      hr - High Resolution|\
      i - Oekaki|\
      ic - Artwork/Critique|\
      int - International|\
      jp - Otaku Culture|\
      k - Weapons|\
      lgbt - LGBT|\
      lit - Literature|\
      m - Mecha|\
      mlp - Pony|\
      mu - Music|\
      n - Transportation|\
      news - Current News|\
      o - Auto|\
      out - Outdoors|\
      p - Photography|\
      po - Papercraft & Origami|\
      pol - Politically Incorrect|\
      pw - Professional Wrestling|\
      qst - Quests|\
      r9k - ROBOT9001|\
      s - Sexy Beautiful Women|\
      s4s - Shit 4chan Says|\
      sci - Science & Math|\
      soc - Cams & Meetups|\
      sp - Sports|\
      t - Torrents|\
      tg - Traditional Games|\
      toy - Toys|\
      trash - Off-Topic|\
      trv - Travel|\
      tv - Television & Film|\
      u - Yuri|\
      v - Video Games|\
      vg - Video Game Generals|\
      vip - Very Important Posts|\
      vm - Video Games/Multiplayer|\
      vmg - Video Games/Mobile|\
      vp - Pokémon|\
      vr - Retro Games|\
      vrpg - Video Games/RPG|\
      vst - Video Games/Strategy|\
      vt - Virtual YouTubers|\
      w - Anime/Wallpapers|\
      wg - Wallpapers/General|\
      wsg - Worksafe GIF|\
      wsr - Worksafe Requests|\
      x - Paranormal|\
      xs - Extreme Sports|\
      y - Yaoi|\
      3|a|aco|adv|an|b|bant|biz|c|cgl|ck|cm|co|d|diy|e|f|fa|fit|g|gd|gif|h|hc|his|hm|hr|i|ic|int|jp|k|lgbt|lit|m|mlp|mu|n|news|o|out|p|po|pol|pw|qst|r9k|s|s4s|sci|soc|sp|t|tg|toy|trash|trv|tv|u|v|vg|vip|vm|vmg|vp|vr|vrpg|vst|vt|w|wg|wsg|wsr|x|xs|y)"
  interval_hours: int(1,168)
  retention_days: int(1,365)
  history_retention_days: int(1,3650)
  # 0 stores every term; a positive cap bounds SQLite writes per focus/run.
  history_max_topics: int(0,10000)
  nlp_cache_max_mib: int(1,)
  max_threads: int(1,500)
  # Values below 1100 are raised to 1100 (4chan API limit: 1 request/second).
  request_delay_ms: int(0,10000)
  # Deprecated since 0.3 (requests are sequential); optional so saved options still validate.
  workers: int(1,32)?
  scrape_timeout_seconds: int(300,86400)
  run_on_startup: bool
  log_level: list(debug|info|warning|error)
  notification_targets:
    - str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Lurker dashboard (optional direct access; Ingress is preferred)
