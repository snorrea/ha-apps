name: Lurker
version: "0.2.15"
slug: lurker
description: Scrape 4chan boards on a schedule and browse sentiment wordclouds in Home Assistant.
url: https://github.com/snorrea/ha-apps/tree/main/lurker
arch:
  - aarch64
  - amd64
image: ghcr.io/snorrea/lurker
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-search
panel_title: Lurker
startup: application
boot: auto
# Needed only for calling opted-in mobile notifications through the Core API proxy.
homeassistant_api: true
options:
  boards:
    - biz
    - pol
  interval_hours: 6
  retention_days: 30
  max_threads: 200
  request_delay_ms: 200
  workers: 8
  scrape_timeout_seconds: 10800
  run_on_startup: true
  log_level: info
  notification_targets: []
schema:
  boards:
    - str
  interval_hours: int(1,168)
  retention_days: int(1,365)
  max_threads: int(1,500)
  request_delay_ms: int(0,10000)
  workers: int(1,32)
  scrape_timeout_seconds: int(300,86400)
  run_on_startup: bool
  log_level: list(debug|info|warning|error)
  notification_targets:
    - str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Lurker dashboard (optional direct access; Ingress is preferred)
